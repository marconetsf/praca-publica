name: Construir marts

# Recalcula dimensão, fato e serving a partir do staging no R2.
#
# Existe por dois motivos. O previsto (OPERACAO §1): o mart precisa ser
# reconstruído quando entra dado novo, sem depender de máquina de ninguém. E o
# aprendido: em 15/08/2026 o R2 ficou inalcançável da máquina de desenvolvimento
# — filtro de rede local — e o trabalho parou. O runner sai de outra rede.
on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Exercício a recalcular"
        required: false
        default: "2024"

permissions:
  contents: read

concurrency:
  # dois builds simultâneos gravariam o mesmo parquet no R2
  group: build-marts
  cancel-in-progress: false

env:
  PRACA_RAW_ROOT: s3://praca-raw
  PRACA_DATA_ROOT: s3://praca-dados

jobs:
  marts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install -e .

      - name: Dimensão de municípios
        run: python -m pipelines.marts.dim_municipio

      - name: Fato de indicadores
        run: python -m pipelines.marts.fato_indicador --ano "${{ inputs.ano }}"

      # Gate 2: aritmética, pisos constitucionais e valor impossível. Sai com
      # erro se houver achado CRÍTICO — mart suspeito não vira JSON servido.
      - name: Gate de sanidade
        run: python -m pipelines.marts.sanidade --ano "${{ inputs.ano }}"

      - name: Gerar JSONs de serving
        run: python -m pipelines.marts.serving --ano "${{ inputs.ano }}"

      # A ficha pública de cada fonte (/fontes). Roda aqui porque depende de dois
      # arquivos que só existem no bucket: o manifesto do espelho e o estado do
      # watcher. Local, sem R2, a página sairia dizendo que nada foi guardado.
      - name: Ficha das fontes
        run: python -m pipelines.marts.fontes

      # O site é construído no Pages a partir destes JSONs; aqui eles ficam como
      # artefato para inspeção e para quem estiver sem acesso ao R2.
      - name: Publicar JSONs como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serving-${{ inputs.ano }}
          path: site/public/dados/
          retention-days: 14

      - name: Avisar falha no Telegram
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🔴 CRITICO — build de marts falhou: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

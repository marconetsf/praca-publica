    orgao: Ministério do Trabalho e Emprego
    publica: >-
      Quem entrou e quem saiu de um emprego com carteira, em cada cidade, e o
      valor do salário.
    atualizacao: >-
      O Caged sai todo mês. A Rais sai uma vez por ano, com cerca de um ano de

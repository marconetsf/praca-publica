# Fonte da verdade de URLs e parâmetros de acesso — pipelines leem daqui, nunca hardcode.
# URLs verificadas em 2026-07-26. Governo muda URLs sem aviso: em caso de 404, atualizar AQUI.
#
# `sonda:` é o que o watcher vigia (pipelines/watcher/sonda.py). Precisa ser um endpoint
# REAL, não o prefixo usado para montar URL — `api_base` cru costuma devolver 404 ou 401 e
# encheria o canal de alarme falso. `status_ok` declara os status que significam "de pé"
# (401 de quem exige token é resposta saudável). Fonte sem `sonda:` não é vigiada.
#
# `guarda:` é o que se guarda desta fonte, e por quê (pipelines/common/guarda.py). Cinco
# modos: integral, recorte, colheita (guardam cópia e podem sustentar número publicado),
# remota e nenhuma (não guardam nada e NÃO publicam). O motivo é obrigatório em tudo que
# não é integral — recusa sem motivo escrito volta como proposta nova a cada seis meses.
# `recorte.pactuado_em: null` faz o pipeline se recusar a colher. Não escreva este bloco
# à mão: `python -m pipelines.reconhecer --url ...` mede e gera. Ver
# docs/arquitetura/INTEGRAR-FONTE.md.
#
# `ficha:` é o que o cidadão lê em /fontes (pipelines/marts/fontes.py). Só o que nenhum
# fato revela sozinho: nome do órgão, o que ele publica em português, endereço oficial e o
# motivo de um bloqueio. A situação ("no site", "guardado", "bloqueado") NÃO se declara
# aqui — ela é derivada dos indicadores publicados, do manifesto e do watcher, senão a
# página envelheceria mentindo. `pagina_oficial` verificada por acesso real em 2026-08-16.

siconfi:
  api_base: https://apidatalake.tesouro.gov.br/ords/siconfi/tt
  throttle_s: 1.0            # consenso da comunidade: ~1 req/s ou risco de bloqueio
  encoding: utf-8
  sonda:
    url: https://apidatalake.tesouro.gov.br/ords/siconfi/tt/entes?an_exercicio=2024
  guarda:
    modo: colheita
    medido_em: 2026-08-16
    volume_gb: 0.05
    risco_sumico: baixo
    onde: actions
    motivo: >-
      API com filtro por ente e exercício: a consulta de um município cabe em
      poucos KB. Guardamos as respostas de cada execução, com os parâmetros
      usados, em vez de espelhar um acervo que a fonte serve sob demanda.
  ficha:
    orgao: Tesouro Nacional
    publica: >-
      As contas de cada prefeitura e de cada estado: quanto entrou de dinheiro e
      quanto saiu em cada área.
    atualizacao: Uma vez por ano. As contas de 2024 só ficaram completas em 2025.
    pagina_oficial: https://siconfi.tesouro.gov.br/siconfi/index.jsf

cnpj_rfb:
  # compartilhamento Nextcloud da Receita; pastas mensais AAAA-MM
  share_url: https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9
  webdav_base: https://arquivos.receitafederal.gov.br/public.php/webdav
  webdav_user: YggdBLfdninEJX9   # senha vazia
  espelho: https://dados-abertos-rf-cnpj.casadosdados.com.br/
  encoding: iso-8859-1
  separador: ";"
  sonda:
    url: https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9
    # o Nextcloud embute token de sessão: o Content-Length muda a cada request
    # (8174 → 8177 em 2 s, medido em 2026-07-26). Vigiar só disponibilidade;
    # dump novo é detectado pelo pipeline da Fase 2, não pelo watcher.
    detectar_mudanca: false
  guarda:
    modo: recorte
    medido_em: 2026-07-26
    volume_gb: 30.0
    risco_sumico: baixo
    onde: vps
    motivo: >-
      7,6 GB por mês em zip e cerca de 30 GB extraídos: 3x o plano de storage
      inteiro para um dump que a Receita republica todo mês. O recorte é o que
      alimenta indicador publicado, e a extração exige disco que o runner não tem.
    recorte:
      pactuado_em: null
      municipios: []
      periodo: []
  ficha:
    orgao: Receita Federal
    publica: O cadastro de todas as empresas do país, com endereço, porte e sócios.
    atualizacao: Uma vez por mês.
    pagina_oficial: https://dados.gov.br/dados/conjuntos-dados/cadastro-nacional-da-pessoa-juridica---cnpj


    # traz Last-Modified, que denuncia mudança de versão da API
    url: https://pncp.gov.br/api/consulta/swagger-ui/index.html
  guarda:
    modo: recorte
    medido_em: 2026-08-16
    volume_gb: 57.7
    risco_sumico: baixo
    onde: actions
    motivo: >-
      Medido em 16/08/2026: 863 KB para um município em um mês, o que dá 57,7 GB
      por ano para o país e entre 4,6 h e 18,6 h de execução contra 6 h de teto do
      runner. Publicar no PNCP é condição de validade do contrato (Lei 14.133),
      então a fonte não corre risco de sumir e o recorte basta.
    recorte:
      pactuado_em: null
      municipios: []
      periodo: []
  ficha:
    orgao: Portal Nacional de Contratações Públicas (PNCP)
    publica: As compras e os contratos de órgãos públicos de todo o país.
    atualizacao: Quase em tempo real — o órgão precisa publicar ali para o contrato valer.
    pagina_oficial: https://www.gov.br/pncp/pt-br


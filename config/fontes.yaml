  rate_limit_madrugada: 300
  sonda:
    url: https://api.portaldatransparencia.gov.br/api-de-dados/despesas/documentos
    status_ok: [200, 401]    # 401 = de pé, exigindo o header chave-api-dados
  guarda:
    modo: colheita
    medido_em: 2026-08-16
    risco_sumico: baixo
    onde: actions
    motivo: >-
      API com filtro e limite de 90 requisições por minuto. Guardamos as
      respostas de cada execução; espelhar o acervo da CGU seria copiar um
      serviço que já é consultável por recorte.
  ficha:
    orgao: Controladoria-Geral da União (CGU)
    publica: >-
      Para onde vai o dinheiro do governo federal: contratos, obras e auxílios
      pagos a famílias.
    atualizacao: Varia por base. Algumas mudam todo dia, outras uma vez por mês.
    # o site público responde 405 a cliente automatizado (WAF); no navegador abre normal

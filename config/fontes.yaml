    risco_sumico: medio
    onde: actions
    motivo: >-
      O CAGED de 2026 e a RAIS 2024 somam cerca de 4 GB e sustentam o indicador de
      emprego formal, que tem direção pactuada. Entram depois do espelho B2: a RAIS
      sozinha triplica o que se perde de uma vez enquanto o acervo tem cópia única.

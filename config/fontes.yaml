    - ftp://ftp.mtps.gov.br/pdet/microdados/NOVO%20CAGED/2026/202602/CAGEDMOV202602.7z
    - ftp://ftp.mtps.gov.br/pdet/microdados/NOVO%20CAGED/2026/202603/CAGEDMOV202603.7z

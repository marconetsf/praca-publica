inep:
  portal: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados
  download_base: https://download.inep.gov.br
  # o servidor manda só o certificado folha, sem o intermediário: o navegador
  # busca o intermediário sozinho (AIA), o Python não. Sem este bundle, toda
  # conexão falha com CERTIFICATE_VERIFY_FAILED. Ver pipelines/common/tls.py
  tls_ca: config/ca/inep.pem
  sonda:
    url: https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2024.zip
    # O servidor recusa conexão vinda de datacenter: "Connection reset by peer" em
    # 19 execuções consecutivas do Actions (26/07 a 14/08/2026), enquanto de rede
    # brasileira responde 12/12 com HTTP 200. A fonte está no ar — inalcançável de lá.
    # Sondar dali produziria um alarme falso por dia. Vale para o espelho também:
    # o INEP foi espelhado da máquina local, e re-espelhar exige rede brasileira.
    bloqueia_datacenter: true
  guarda:
    modo: integral
    medido_em: 2026-07-27
    volume_gb: 0.19
    risco_sumico: alto
    onde: brasil
    motivo: >-
      Fonte com apagão comprovado: o Ideb de 2019 e 2021 já responde 404 na
      origem. Guarda integral mesmo sem indicador publicado — bytes se compram,
      série apagada não volta. A aquisição não roda no Actions.
  ficha:
    orgao: Inep (Ministério da Educação)
    publica: >-
      Os dados de cada escola do país: alunos, turmas, professores e notas.
    atualizacao: Uma vez por ano, com quase um ano de atraso.
    pagina_oficial: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados
    bloqueio: >-
      O servidor do Inep recusa conexão vinda de máquinas de nuvem. Por isso os
      arquivos foram guardados de um computador comum, e não pela rotina
      automática. Parte da série do Ideb já saiu do ar antes de guardarmos.
  # Onda 1 do M0.5: o INEP apagou séries em 2022 e nunca republicou completas.
  # Confirmado em 2026-07-26: IDEB de 2019 e 2021 já responde 404 nestas URLs —
  # sobrou só 2023. Espelhar o que ainda existe, antes das eleições.
  espelho:
    - https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2020.zip
    - https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2021.zip
    - https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2022.zip
    - https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2023.zip
    - https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2024.zip
    - https://download.inep.gov.br/ideb/resultados/divulgacao_anos_iniciais_municipios_2023.zip
    - https://download.inep.gov.br/ideb/resultados/divulgacao_anos_finais_municipios_2023.zip

snis:
  # Situação verificada em 2026-07-27 — NENHUM caminho programático funciona hoje.
  # O SNIS encerrou a coleta em 2023; o SINISA o sucede desde 2024. A série
  # histórica (água/esgoto desde 1995, resíduos desde 2002) é o acervo em risco.
  #
  #   app4.mdr.gov.br          DNS não resolve (host do extinto MDR)
  #   app4.cidades.gov.br      403 "Access Denied." (appliance na frente; não é
  #                            User-Agent — testado com UA de navegador também)
  #   dadosabertos.cidades...  403 idem, inclusive na API CKAN
  #   dados.gov.br/api         com chave: o conjunto existe (id 6fe74559-d671-
  #                            4f59-8a06-8d823a895ba2, "SNIS - Série Histórica",
  #                            dados de 25/04/2023) mas tem UM ÚNICO recurso,
  #                            formato HTML, apontando para o app4.mdr.gov.br
  #                            morto. O catálogo federal aponta para o vazio.
  #                            SINISA: 0 conjuntos no catálogo.
  #
  # Sem sonda: 403 de WAF não distingue "fonte no ar" de "fonte apagada", então
  # vigiar isso só produziria alarme sem informação.
  portal: https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/snis
  sinisa: https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/sinisa
  ckan: https://dadosabertos.cidades.gov.br/pt_PT/dataset/snis-serie-historica
  # espelho: pendente — ver docs/ESCOPO.md M0.5.2 e a decisão registrada em FONTES.md §7
  guarda:
    modo: nenhuma
    medido_em: 2026-07-27
    risco_sumico: alto
    onde: nenhum
    motivo: >-
      Não há caminho programático: o endereço antigo não resolve DNS, o novo
      responde 403 de appliance e o catálogo federal só guarda um link para a
      página morta. Guardar exigiria download manual pelo navegador ou fonte de
      terceiro. É o caso extremo do risco que a guarda integral existe para evitar.
  ficha:
    orgao: Ministério das Cidades
    publica: Quanta gente tem água tratada e coleta de esgoto em cada cidade.
    atualizacao: A coleta parou em 2023. O sistema novo, o Sinisa, ainda não publicou a série.
    pagina_oficial: https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/snis
    nao_vigiada: >-
      não sobrou endereço que responda, e o bloqueio do portal não distingue
      fonte no ar de fonte apagada
    bloqueio: >-
      A série histórica saiu do ar. O endereço antigo não existe mais, o novo
      barra o acesso automático, e o catálogo do governo federal só guarda um
      link para a página que morreu.

datasus:
  ftp: ftp://ftp.datasus.gov.br/dissemin/publicos/
  # preferir pysus para download + conversão DBC->parquet
  # sem sonda: só existe por FTP (porta 443 do host dá timeout) — watcher v2
  #
  guarda:
    modo: integral
    medido_em: 2026-07-27
    volume_gb: 1.88
    risco_sumico: medio
    onde: actions
    motivo: >-
      Os agregados nacionais de mortalidade e nascimento cabem em 1,9 GB e são a
      base dos indicadores de saúde da fila. O SIH fica de fora por enquanto.
    recusado:
      - alvo: SIH (internações), 66 GB
        motivo: >-
          Só existe por UF e mês, sem filtro por município na origem. São 6,6x o
          plano de storage inteiro para sustentar nenhum indicador pactuado.
          Reavaliar quando houver indicador de saúde com direção definida — e aí
          entra por recorte, ano a ano, nunca integral.
  ficha:
    orgao: DataSUS (Ministério da Saúde)
    publica: Registros de nascimentos, mortes e internações no SUS, cidade por cidade.
    atualizacao: >-
      Todo mês para internações. Mortes e nascimentos levam de um a dois anos
      para fechar.
    pagina_oficial: https://datasus.saude.gov.br/transferencia-de-arquivos/
    nao_vigiada: só existe por FTP, e o vigia automático hoje só fala HTTP
  # Onda 2 do M0.5 — "DataSUS alvo": os agregados NACIONAIS (DOBR/DNBR), não os
  # 812 arquivos por UF. O SIM tem a série nacional completa de mortalidade
  # 1996–2024 (2,4 GB); o SINASC só publica nacional de 2014 a 2017 — os demais
  # anos existem apenas por UF (verificado em 27/07/2026).
